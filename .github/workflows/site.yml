# The gate on every push and pull request, and on main the deploy, which runs
# only once the gate has passed. Logan's rule (2026-09-29): every push deploys,
# from the start. Nothing here deploys a push that failed its gate.
#
# CI has only the public repositories, which it fetches at their pins
# (LOGANW_FETCH=1), and no login that can list private repositories. So these
# are SKIPPED BY NAME here, never passed:
#   - the `build` stage, which renders and needs every clone;
#   - the `privacy` and `github` stages, which need a login that can read the
#     owner's private repositories (here `facts` fetches every public pin from
#     GitHub, which fails on a commit GitHub does not have);
#   - each figure from a private repository, inside `facts`;
#   - the drift, stale-pin and github controls, inside `controls`.
# Everything else runs:
#   - `manifest`, which holds public/ to its MANIFEST, so a deleted page, or
#     a page edited without its MANIFEST line, fails here;
#   - `numbers`, `links`, `local-only` and `docs`;
#   - the other controls, and the runner's own.
# A hand edit that also rewrites MANIFEST passes here. The desktop, which has
# every clone, runs `bash verify/run.sh --require-all` before any push
# (CLAUDE.md), and its `build` stage is what sees that.
#
# Runs are grouped per ref, and a superseded run is cancelled. A cancelled run
# is not a pass: check that the tip's run finished.
name: site
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The one library the gate uses: a control reads each ledger a second
      # way with it, CommonMark's own parser, pinned by version and by hash.
      - run: python -m pip install --require-hashes --no-deps -r verify/requirements.txt
      - run: LOGANW_FETCH=1 bash verify/run.sh
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: stage public/ as committed, and write which commit it is into BUILD
        run: |
          cp -r public _site
          printf 'Deployed from %s\n' "$GITHUB_SHA" > _site/BUILD
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
